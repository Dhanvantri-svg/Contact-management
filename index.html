<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Contact Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 25px 10px; }
        .container { background: white; width: 100%; max-width: 450px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 15px; text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #0066cc; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0052a3; }
        .search-box { margin-top: 15px; border-color: #0066cc; }
        ul { list-style: none; margin-top: 15px; }
        li { background: #f9f9f9; padding: 10px; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .actions button { width: auto; padding: 5px 8px; font-size: 12px; margin-left: 5px; }
        .edit-btn { background: #ff9800; }
        .del-btn { background: #ff4d4d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud Contact Manager</h2>
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="nameInput" placeholder="Name">
    <input type="text" id="phoneInput" placeholder="Phone Number">
    <button id="saveBtn">Save to Cloud</button>

    <input type="text" id="searchInput" class="search-box" placeholder="Search contacts..." onkeyup="searchContacts()">
    <ul id="contactList"></ul>
</div>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  // Firebase Configuration 
    const firebaseConfig = {
    apiKey: "AIzaSyBFE2E0FAQp0RkHeP-5EFWFAr_lMdsKwG0",
    authDomain: "contact-manager-9bfb9.firebaseapp.com",
    databaseURL: "https://contact-manager-9bfb9-default-rtdb.firebaseio.com",
    projectId: "contact-manager-9bfb9",
    storageBucket: "contact-manager-9bfb9.firebasestorage.app",
    messagingSenderId: "617092013007",
    appId: "1:617092013007:web:b36f4b4da655841ac690ba"
  };


  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const contactsRef = database.ref('contacts');

  let allContacts = [];

  // Load Contacts Real-time from Firebase
  contactsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    allContacts = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
    renderContacts(allContacts);
  });

  // Render Contacts to UI
  function renderContacts(data = allContacts) {
    const list = document.getElementById('contactList');
    list.innerHTML = '';
    if (data.length === 0) {
      list.innerHTML = '<p style="color: #666; text-align: center;">No contacts found.</p>';
      return;
    }
    data.forEach((c) => {
      list.innerHTML += `
        <li>
          <div>
            <strong>${c.name}</strong><br>
            <small style="color: #555;">${c.phone}</small>
          </div>
          <div class="actions">
            <button class="edit-btn" onclick="editContact('${c.id}')">Edit</button>
            <button class="del-btn" onclick="deleteContact('${c.id}')">Delete</button>
          </div>
        </li>
      `;
    });
  }

  // Save / Update Contact
  document.getElementById('saveBtn').addEventListener('click', () => {
    const nameInput = document.getElementById('nameInput');
    const phoneInput = document.getElementById('phoneInput');
    const editIndex = document.getElementById('editIndex');

    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();

    if (!name || !phone) {
      alert('Please enter Name and Phone number');
      return;
    }

    if (editIndex.value === "-1") {
      // Add New
      contactsRef.push({ name, phone });
      alert('Contact Saved!');
    } else {
      // Update Existing
      const contactId = editIndex.value;
      database.ref('contacts/' + contactId).update({ name, phone });
      editIndex.value = "-1";
      document.getElementById('saveBtn').innerText = 'Save Contact';
      alert('Contact Updated!');
    }

    nameInput.value = '';
    phoneInput.value = '';
  });

  // Edit Contact Setup
  function editContact(id) {
    const contact = allContacts.find(c => c.id === id);
    if (contact) {
      document.getElementById('nameInput').value = contact.name;
      document.getElementById('phoneInput').value = contact.phone;
      document.getElementById('editIndex').value = id;
      document.getElementById('saveBtn').innerText = 'Update Contact';
    }
  }

  // Delete Contact
  function deleteContact(id) {
    if (confirm("Delete this contact?")) {
      database.ref('contacts/' + id).remove();
    }
  }

  // Search Contacts
  function searchContacts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allContacts.filter(c => 
      c.name.toLowerCase().includes(query) || c.phone.includes(query)
    );
    renderContacts(filtered);
  }
</script>


</body>
</html>
