<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Contact Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f7; display: flex; justify-content: center; padding: 30px 15px; }
        .container { background: white; width: 100%; max-width: 480px; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .input-group { margin-bottom: 12px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; }
        input:focus { border-color: #0066cc; }
        .btn-main { width: 100%; padding: 11px; background-color: #0066cc; color: white; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-main:hover { background-color: #0052a3; }
        .search-box { margin-bottom: 15px; border-color: #0066cc; background-color: #fcfcfc; }
        h3 { margin-top: 10px; margin-bottom: 12px; color: #444; border-bottom: 2px solid #eee; padding-bottom: 6px; font-size: 16px; }
        ul { list-style: none; }
        li { background: #f8f9fa; padding: 10px 12px; border: 1px solid #e9ecef; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .contact-info { max-width: 65%; word-break: break-word; }
        .actions button { padding: 6px 10px; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 4px; font-weight: bold; }
        .edit-btn { background: #f39c12; }
        .edit-btn:hover { background: #d68910; }
        .del-btn { background: #e74c3c; }
        .del-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud Contact Manager</h2>
    
    <!-- Hidden input to track editing index -->
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Name">
    </div>
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="Phone Number">
    </div>
    <button id="saveBtn" class="btn-main">Save to Cloud</button>

    <h3>Saved Contacts</h3>
    <input type="text" id="searchInput" class="search-box" placeholder="Search contacts by name...">
    
    <ul id="contactList"></ul>
</div>

<script>
    // Initialize LocalStorage Data
    let contacts = JSON.parse(localStorage.getItem('cloud_contacts')) || [];

    // Render Contacts Function (View & Search support)
    function renderContacts(data = contacts) {
        const list = document.getElementById('contactList');
        list.innerHTML = '';
        
        if (data.length === 0) {
            list.innerHTML = '<p style="color:#888; font-size:13px; text-align:center; padding: 10px;">No contacts found.</p>';
            return;
        }
        
        data.forEach((c, index) => {
            // Find actual index in original contacts array
            const actualIndex = contacts.indexOf(c);
            
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="contact-info">
                    <strong>${escapeHTML(c.name)}</strong><br>
                    <small style="color:#666;">${escapeHTML(c.phone)}</small>
                </div>
                <div class="actions">
                    <button class="edit-btn" onclick="editContact(${actualIndex})">Edit</button>
                    <button class="del-btn" onclick="deleteContact(${actualIndex})">Delete</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    // Escape HTML to prevent XSS issues
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    // Add and Update Logic
    document.getElementById('saveBtn').addEventListener('click', function() {
        const nameInput = document.getElementById('nameInput');
        const phoneInput = document.getElementById('phoneInput');
        const editIndexInput = document.getElementById('editIndex');

        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const editIndex = parseInt(editIndexInput.value);

        if (!name || !phone) {
            alert('Please enter both Name and Phone Number!');
            return;
        }

        if (editIndex === -1) {
            // Create / Add New
            contacts.push({ name, phone });
            alert('Contact Saved Successfully!');
        } else {
            // Update Existing
            contacts[editIndex] = { name, phone };
            editIndexInput.value = "-1";
            document.getElementById('saveBtn').innerText = "Save to Cloud";
            alert('Contact Updated Successfully!');
        }

        localStorage.setItem('cloud_contacts', JSON.stringify(contacts));
        nameInput.value = '';
        phoneInput.value = '';
        document.getElementById('searchInput').value = '';
        renderContacts();
    });

    // Edit Function
    window.editContact = function(index) {
        document.getElementById('nameInput').value = contacts[index].name;
        document.getElementById('phoneInput').value = contacts[index].phone;
        document.getElementById('editIndex').value = index;
        document.getElementById('saveBtn').innerText = "Update Contact";
    };

    // Delete Function
    window.deleteContact = function(index) {
        if (confirm("Are you sure you want to delete this contact?")) {
            contacts.splice(index, 1);
            localStorage.setItem('cloud_contacts', JSON.stringify(contacts));
            
            // Reset edit state if deleted item was being edited
            if (parseInt(document.getElementById('editIndex').value) === index) {
                document.getElementById('editIndex').value = "-1";
                document.getElementById('saveBtn').innerText = "Save to Cloud";
                document.getElementById('nameInput').value = '';
                document.getElementById('phoneInput').value = '';
            }
            
            renderContacts();
        }
    };

    // Live Search Function
    document.getElementById('searchInput').addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        const filtered = contacts.filter(c => c.name.toLowerCase().includes(query));
        renderContacts(filtered);
    });

    // Initial render call on page load
    renderContacts();
</script>

</body>
</html>
